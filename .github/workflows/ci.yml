name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (${{ matrix.db.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db:
          - name: PostgreSQL
            image: postgres:16-alpine
            env:
              POSTGRES_DB: cenkor_test
              POSTGRES_USER: cenkor
              POSTGRES_PASSWORD: test_pwd
            port: 5432
            url_driver: postgresql+asyncpg
            url_sync: postgresql
            health_cmd: pg_isready -U cenkor

    services:
      db:
        image: ${{ matrix.db.image }}
        env: ${{ matrix.db.env }}
        ports:
          - "${{ matrix.db.port }}:${{ matrix.db.port }}"
        options: >-
          --health-cmd "${{ matrix.db.health_cmd }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install \
            "fastapi>=0.110" \
            "uvicorn[standard]>=0.27" \
            "pydantic>=2.6" \
            "pydantic-settings>=2.2" \
            "pydantic-extra-types>=2.5" \
            "sqlalchemy[asyncio]>=2.0" \
            "alembic>=1.13" \
            "asyncpg>=0.29" \
            "psycopg2-binary>=2.9" \
            "redis>=5.0" \
            "celery[redis]>=5.3" \
            "python-jose[cryptography]>=3.3" \
            "passlib[bcrypt]>=1.7" \
            "bcrypt>=3.2,<4.0" \
            "httpx>=0.27" \
            "requests>=2.31" \
            "boto3>=1.34" \
            "aiobotocore>=2.5" \
            "structlog>=24.1" \
            "loguru>=0.7.2" \
            "python-slugify>=8.0" \
            "Pillow>=10.0" \
            "email-validator>=2.1" \
            "python-multipart>=0.0.9" \
            "pytest>=8.0" \
            "pytest-asyncio>=0.23" \
            "pytest-cov>=4.1" \
            "ruff>=0.3" \
            "mypy>=1.8"

      - name: Lint
        run: cd backend && ruff check .

      - name: Type check
        run: cd backend && mypy src/ --ignore-missing-imports || true
        continue-on-error: true

      - name: 迁移图自检（无断链 / 单 head）
        run: python3 scripts/check-migration-graph.py --tracked-only

      - name: Init DB & Run migrations
        env:
          DB_NAME: ${{ matrix.db.name }}
          DB_DRIVER: ${{ matrix.db.url_driver }}
          DB_URL_SYNC: ${{ matrix.db.url_sync }}
        run: |
          cd backend
          DATABASE_URL_SYNC="postgresql+psycopg2://cenkor:test_pwd@localhost:5432/cenkor_test" \
          alembic upgrade heads

      - name: Run tests
        env:
          DB_NAME: ${{ matrix.db.name }}
          DB_DRIVER: ${{ matrix.db.url_driver }}
          DB_URL_SYNC: ${{ matrix.db.url_sync }}
        run: |
          cd backend
          export DATABASE_URL="postgresql+asyncpg://cenkor:test_pwd@localhost:5432/cenkor_test"
          export DATABASE_URL_SYNC="postgresql+psycopg2://cenkor:test_pwd@localhost:5432/cenkor_test"
          export SECRET_KEY="ci-test-secret-key-32-bytes-min"
          export REDIS_URL="redis://localhost:6379/0"
          export S3_ENDPOINT="http://127.0.0.1:9000"
          export S3_ACCESS_KEY="minio"
          export S3_SECRET_KEY="minio12345"
          export PYTHONPATH=src
          # 只跑单元测试；集成测试（test_auth/cms/content_engine/notification/portal/rbac）
          # 依赖真 uvicorn:8002 + seed 数据（见 tests/conftest.py），留 E2E 环境跑，不进轻量 CI 门禁
          python -m pytest tests/ \
            --ignore=tests/test_auth.py \
            --ignore=tests/test_cms.py \
            --ignore=tests/test_content_engine.py \
            --ignore=tests/test_notification.py \
            --ignore=tests/test_portal.py \
            --ignore=tests/test_rbac.py \
            -v --tb=short --cov=cenkor_admin --cov-report=xml --cov-report=term

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-web, portal-web]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 部署成功
        run: echo "✓ Backend + Frontend 都通过"
