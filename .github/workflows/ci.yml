name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (${{ matrix.db.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db:
          - name: PostgreSQL
            image: postgres:16-alpine
            env:
              POSTGRES_DB: cenkor_test
              POSTGRES_USER: cenkor
              POSTGRES_PASSWORD: test_pwd
            port: 5432
            url_driver: postgresql+asyncpg
            url_sync: postgresql
            health_cmd: pg_isready -U cenkor

    services:
      db:
        image: ${{ matrix.db.image }}
        env: ${{ matrix.db.env }}
        ports:
          - "${{ matrix.db.port }}:${{ matrix.db.port }}"
        options: >-
          --health-cmd "${{ matrix.db.health_cmd }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          # 直接装权威清单 requirements.txt（此前手工精简清单漏了 pgvector/python-liquid/markdown/aiomysql/python-dotenv，
          # 导致 alembic 加载 env.py -> db.py -> models 时 ModuleNotFoundError，Init DB 步骤必挂）
          pip install -r requirements.txt
          # requests：tests/conftest.py 顶层 import（集成测试用），不在 requirements.txt
          # pytest 全家桶 + ruff + mypy：CI 专用工具
          pip install \
            "requests>=2.31" \
            "pytest>=8.0" \
            "pytest-asyncio>=0.23" \
            "pytest-cov>=4.1" \
            "ruff>=0.3" \
            "mypy>=1.8"

      # 依赖声明自洽性：requirements.txt 里两个包互相矛盾时，pip 不报错、只挑一个装上，
      # 冲突要等运行时才炸。2026-11-03 就踩过：aiobotocore 2.5.0 钉死 botocore 1.29.x，
      # 与 boto3>=1.34 对撞，连带 urllib3 被压到 1.26（trafilatura 要 2.8 装不上），全程无告警。
      # 注意：闭源应用（apps/*/requirements.txt）不在此门禁内，只能覆盖主清单。
      - name: 依赖一致性检查
        run: pip check

      - name: Lint
        run: cd backend && ruff check .

      - name: Type check
        run: cd backend && mypy src/ --ignore-missing-imports || true
        continue-on-error: true

      - name: 迁移图自检（无断链 / 单 head）
        run: python3 scripts/check-migration-graph.py --tracked-only

      - name: Init DB & Run migrations
        env:
          DB_NAME: ${{ matrix.db.name }}
          DB_DRIVER: ${{ matrix.db.url_driver }}
          DB_URL_SYNC: ${{ matrix.db.url_sync }}
        run: |
          cd backend
          DATABASE_URL_SYNC="postgresql+psycopg2://cenkor:test_pwd@localhost:5432/cenkor_test" \
          alembic upgrade heads

      # 迁移图自洽 ≠ 迁移完整。历史上出现过两次「ORM 有表/列、迁移没建」：
      # 2026-11-02 的 12 张 AI 表、2026-11-03 的 6 张 CMS 表 + 18 个字段。
      # 这类缺口 alembic 不会报错，单元测试也测不到，只有真连库比对才露出来。
      # 上一行刚把库建好，正好在这里对账。
      - name: ORM ↔ 迁移 漂移检查
        env:
          DATABASE_URL_SYNC: "postgresql+psycopg2://cenkor:test_pwd@localhost:5432/cenkor_test"
        run: |
          cd backend
          PYTHONPATH=src python3 ../scripts/check-orm-drift.py --strict

      - name: Run tests
        env:
          DB_NAME: ${{ matrix.db.name }}
          DB_DRIVER: ${{ matrix.db.url_driver }}
          DB_URL_SYNC: ${{ matrix.db.url_sync }}
        run: |
          cd backend
          export DATABASE_URL="postgresql+asyncpg://cenkor:test_pwd@localhost:5432/cenkor_test"
          export DATABASE_URL_SYNC="postgresql+psycopg2://cenkor:test_pwd@localhost:5432/cenkor_test"
          export SECRET_KEY="ci-test-secret-key-32-bytes-min"
          export REDIS_URL="redis://localhost:6379/0"
          export S3_ENDPOINT="http://127.0.0.1:9000"
          export S3_ACCESS_KEY="minio"
          export S3_SECRET_KEY="minio12345"
          export PYTHONPATH=src
          # 只跑单元测试；集成测试（test_auth/cms/content_engine/notification/portal/rbac）
          # 依赖真 uvicorn:8002 + seed 数据（见 tests/conftest.py），留 E2E 环境跑，不进轻量 CI 门禁
          python -m pytest tests/ \
            --ignore=tests/test_auth.py \
            --ignore=tests/test_cms.py \
            --ignore=tests/test_content_engine.py \
            --ignore=tests/test_notification.py \
            --ignore=tests/test_portal.py \
            --ignore=tests/test_rbac.py \
            -v --tb=short --cov=cenkor_admin --cov-report=xml --cov-report=term

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-web, portal-web]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  frontend-lock:
    name: Frontend (lock 一致性)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 为什么单独一个 job、而不是塞进上面的 matrix：
      #
      # 上面的 matrix 是 working-directory 到 frontend/<app> 里跑 npm ci，
      # npm 只校验「该 workspace 实际需要的依赖」，看不见别的 workspace 的
      # 缺口。2026-11-11 就是这样漏掉的：c075dab 把 admin-web 的 Tiptap 升到
      # 3.33.0 重生成 lock，把 developer-web 仍声明的 Tiptap 2.x 实体节点整段
      # 删了，matrix 两个 app 全绿，而仓库根任何一次 npm ci 都被拒。
      #
      # 这个 job 只读 package.json + package-lock.json + .npmrc，不需要
      # node_modules，跑几秒就完。详见 scripts/check-npm-lock.py 的模块文档。
      #
      # 注意 frontend/developer-web 是刻意不入库的闭源资产，CI 里没有它的
      # 源码。脚本会改用 lock 自带的该 workspace 声明块来校验 —— 恰好就是
      # 能抓到上面那个 bug 的那一层。
      - name: Check lock consistency
        run: python3 scripts/check-npm-lock.py

  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [backend, frontend, frontend-lock]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 部署成功
        run: echo "✓ Backend + Frontend 都通过"
