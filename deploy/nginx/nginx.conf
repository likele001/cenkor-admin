user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # 上传体积：默认 1m 会让应用包/媒体上传直接 413
    client_max_body_size 50m;

    # 上游
    upstream cenkor_backend {
        server backend:8000;
    }
    upstream cenkor_admin_web {
        server admin-web:5173;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 可选 · 外部官网 — 见 deploy/addons/website/
    # include snippets/website.conf;

    # 后台管理
    server {
        listen 443 ssl http2;
        server_name admin.cenkor.cn;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://cenkor_admin_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://cenkor_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket 实时通知（前缀比 /api/ 长，优先命中）。
        # 缺这段 nginx 会当普通 HTTP 转发，后端识别不到 upgrade，通知永不推送。
        location /api/v1/ws/ {
            proxy_pass http://cenkor_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # 应用插件前端资源（/.app-assets/{key}/plugin.js 等，由后端提供）。
        # 用 ^~ 是为了在有 .js 类正则 location 时优先命中前缀：否则插件脚本会被
        # 静态规则接走（或落到前端 SPA 回退）→ 404 / 返回 index.html，
        # 结果是插件应用页面全部显示「页面不存在」。
        location ^~ /.app-assets/ {
            proxy_pass http://cenkor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
