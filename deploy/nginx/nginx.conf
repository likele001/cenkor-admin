user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # 上游
    upstream cenkor_backend {
        server backend:8000;
    }
    upstream cenkor_admin_web {
        server admin-web:5173;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 可选 · 外部官网 — 见 deploy/addons/website/
    # include snippets/website.conf;

    # 后台管理
    server {
        listen 443 ssl http2;
        server_name admin.cenkor.cn;
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://cenkor_admin_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # 后端 API
        location /api/ {
            proxy_pass http://cenkor_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
