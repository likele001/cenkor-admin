# 管理后台 · 宝塔「配置文件」片段
# 网站 → admin.cenkor.cn → 设置 → 配置文件
# 在 server { ... } 内、已有 location 块之外，追加下面三个 location

# 1. 后端 API
location /api/ {
    client_max_body_size 50m;
    proxy_pass http://127.0.0.1:8002/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 2. WebSocket 通知（必须放在 /api/ 之后，匹配优先级更高）
location /api/v1/ws/ {
    proxy_pass http://127.0.0.1:8002/api/v1/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400s;
}

# 3. 应用插件前端资源（插件应用的 plugin.js 等，由后端动态提供）
#    ⚠️ 缺这条时：已安装的插件应用（云存储 /cloud_storage 等）前端路由注册不上，
#       直接访问或硬刷新该 URL 会落到前端 404 页（菜单里点进去才正常）。
location ^~ /.app-assets/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
