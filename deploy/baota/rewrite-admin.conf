# 宝塔 · 伪静态（网站 → 设置 → 伪静态）
# ⚠️ 不要写 location /，否则会与主配置 duplicate location "/"
# 只用 if + rewrite 做 SPA 回退

# SPA 回退：排除 /api/，避免 API 被 rewrite 到 index.html
set $spa_fallback 0;
if ($uri !~ ^/api/) {
    set $spa_fallback 1;
}
if (!-e $request_filename) {
    set $spa_fallback "${spa_fallback}1";
}
if ($spa_fallback = 11) {
    rewrite ^ /index.html last;
}
