[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = space
version_locations = %(here)s/alembic/versions/core %(here)s/alembic/versions/erp %(here)s/alembic/versions/crm %(here)s/alembic/versions/mes %(here)s/alembic/versions/commerce %(here)s/alembic/versions/ext
sqlalchemy.url = postgresql+psycopg2://USER:PASSWORD@localhost:5432/cenkor
# 实际连接串由 alembic/env.py 从 backend/.env 的 DATABASE_URL_SYNC 注入，此处仅占位
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
