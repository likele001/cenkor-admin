key: inventory
name: 库存管理
version: 1.0.0
icon: 📦
category: business
author: Cenkor Team
description: 库存基础资料：仓库 / 库位
sort: 80
entities:
- key: warehouse
  name: 仓库
  title: 仓库
  subtitle: 仓库基础资料
  fields:
  - name: code
    type: string
    len: 32
    required: true
    unique: true
    label: 仓库编码
    list: true
    search: true
  - name: name
    type: string
    len: 100
    required: true
    label: 仓库名称
    list: true
    search: true
  - name: type
    type: enum
    choices:
    - 成品仓
    - 原料仓
    - 半成品仓
    label: 仓库类型
    list: true
    search: true
    filter: true
  - name: enable
    type: bool
    default: true
    label: 是否启用
    list: true
    filter: true
  - name: remark
    type: text
    label: 备注
- key: location
  name: 库位
  title: 库位
  subtitle: 仓库下的库位
  fields:
  - name: code
    type: string
    len: 32
    required: true
    unique: true
    label: 库位编码
    list: true
    search: true
  - name: name
    type: string
    len: 100
    required: true
    label: 库位名称
    list: true
  - name: warehouse_id
    type: fk
    entity: warehouse
    label: 所属仓库
    list: true
    filter: true
  - name: capacity
    type: decimal
    precision: 10
    scale: 2
    label: 容量
    list: true
