[project]
name = "cenkor-admin"
version = "0.1.0"
description = "Cenkor Admin Platform — FastAPI + SQLAlchemy + 应用中心"
authors = [{ name = "Cenkor" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",

    # DB
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",          # PG 异步驱动
    "aiomysql>=0.2.0",          # MySQL 异步驱动（兼容）
    "psycopg2-binary>=2.9.9",   # PG 同步驱动（Alembic 用）

    # Cache / Queue
    "redis>=5.0.0",
    "celery[redis]>=5.3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0",  # passlib 1.7.4 不兼容 bcrypt 4.x
    "python-dotenv>=1.0.0",

    # HTTP / 集成
    "httpx>=0.27.0",            # 飞书 OAuth 用
    "boto3>=1.34.0",            # S3/MinIO 客户端
    "aiobotocore>=2.5.0",       # S3 异步

    # Utils
    "structlog>=24.1.0",
    "loguru>=0.7.2",
    "pydantic-extra-types>=2.5.0",
    "email-validator>=2.1.0",
    "python-slugify>=8.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "ipython>=8.20.0",
    "faker>=23.2.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # 行长度：已统一由格式化器处理，不再逐行告警
    "B008",   # FastAPI 的 Depends() 默认值是标准写法
    "RUF001", # 中文全角标点（字符串内）
    "RUF002", # 中文全角标点（docstring 内）
    "RUF003", # 中文全角标点（注释内）

    # ---- 2026-10-27 存量豁免（105 处，已在 docs/migrations.md §15 登记）----
    # 这些是历史代码风格，改起来风险大于收益；新代码请勿沿用。
    "UP031",   # % 格式化：剩余 25 处含 % 字面量，自动转 f-string 不安全
    "E701",   # if x: return 单行写法
    "E702",   # 分号分隔多语句
    "N806",   # 函数内变量用大写（JSON_TYPE 这类常量风格）
    "N812",   # 小写名字 import 成大写字面量
    "N814",   # 驼峰名字 import 成常量别名
    "E402",   # scripts/ 里 sys.path.insert 之后再 import，属必要写法
    "SIM105", # 用 try/except/pass 而非 contextlib.suppress
    "SIM108", # 用 if/else 而非三元表达式
    "SIM115", # 裸 open() 未用 with
    "RUF012", # 类属性可变默认值
    "RUF006", # asyncio.create_task 未保存引用 —— 潜在真问题，待单独修
    "B007",   # 循环变量未使用
    "B904",   # except 里 raise 未带 from —— 建议逐步补异常链
    "E741",   # 变量名 l / I / O 易混淆，存量 5 处
    "SIM117", # 嵌套 async with，语义正确，合并易出错
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
