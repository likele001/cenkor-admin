[project]
name = "cenkor-admin"
version = "0.1.0"
description = "Cenkor Admin Platform — FastAPI + SQLAlchemy + 应用中心"
authors = [{ name = "Cenkor" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Core
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",

    # DB
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",          # PG 异步驱动
    "aiomysql>=0.2.0",          # MySQL 异步驱动（兼容）
    "psycopg2-binary>=2.9.9",   # PG 同步驱动（Alembic 用）

    # Cache / Queue
    "redis>=5.0.0",
    "celery[redis]>=5.3.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0",  # passlib 1.7.4 不兼容 bcrypt 4.x
    "python-dotenv>=1.0.0",

    # HTTP / 集成
    "httpx>=0.27.0",            # 飞书 OAuth 用
    "boto3>=1.34.0",            # S3/MinIO 客户端
    "aiobotocore>=2.5.0",       # S3 异步

    # Utils
    "structlog>=24.1.0",
    "loguru>=0.7.2",
    "pydantic-extra-types>=2.5.0",
    "email-validator>=2.1.0",
    "python-slugify>=8.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "ipython>=8.20.0",
    "faker>=23.2.0",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
