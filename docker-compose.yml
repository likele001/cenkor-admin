version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cenkor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cenkor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # MinIO 官方镜像已不可用（详见 docker-compose.fullstack.yml 注释），改用 Chainguard 镜像。
    # 默认走 Docker Hub（国内可用加速器代理）；如需换源，在 .env 里设 MINIO_IMAGE。
    image: ${MINIO_IMAGE:-chainguard/minio:latest}
    container_name: cenkor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Chainguard 镜像无 curl/wget，用 bash 的 /dev/tcp 探测
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cenkor-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: uvicorn cenkor_admin.main:app --host 0.0.0.0 --port 8000 --reload

  admin-web:
    build:
      context: ./frontend/admin-web
      dockerfile: Dockerfile
      target: development
    container_name: cenkor-admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/admin-web/src:/app/src
      - ./frontend/admin-web/index.html:/app/index.html
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # 用户中心 SPA。.env.example 里的 PORTAL_WEB_PORT / frontend/portal-web/Dockerfile
  # 一直都在，只是此前漏了本服务 → 文档与实现不一致（/deploy 页面写的 5175 被当成"不存在的端口"）。
  # 开发态直接用 vite dev（自带 HMR，且 vite.config 已把 /api 代理到后端）。
  portal-web:
    build:
      context: ./frontend/portal-web
      dockerfile: Dockerfile
      target: development
    container_name: cenkor-portal-web
    restart: unless-stopped
    ports:
      - "${PORTAL_WEB_PORT:-5175}:5175"
    volumes:
      - ./frontend/portal-web/src:/app/src
      - ./frontend/portal-web/index.html:/app/index.html
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5175

  nginx:
    image: nginx:alpine
    container_name: cenkor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - admin-web

volumes:
  postgres-data:
  redis-data:
  minio-data:
